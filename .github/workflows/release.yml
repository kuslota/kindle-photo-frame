name: Build release packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  prep:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            architecture: x64
            artifact: Kindle-Photo-Prep-Windows-x64
          - os: macos-15
            architecture: arm64
            artifact: Kindle-Photo-Prep-macOS-Apple-Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install -r packaging/requirements-build.txt
      - name: Check native dependencies
        run: python -c "import tkinter, pillow_heif, platform; print(platform.machine()); assert tkinter.Tcl().eval('info patchlevel')"
      - run: python -m unittest discover -s tests
      - run: python -m PyInstaller --clean --noconfirm packaging/KindlePhotoPrep.spec
      - name: Verify frozen application
        run: python tools/smoke_packaged.py
      - name: Archive Windows folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist/Kindle Photo Prep' -DestinationPath 'dist/${{ matrix.artifact }}.zip'
      - name: Archive macOS bundle (preserve symlinks)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/Kindle Photo Prep.app' 'dist/${{ matrix.artifact }}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error
  plugin:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/package_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: Kindle-Photo-Frame-Plugin
          path: dist/Kindle-Photo-Frame-Plugin.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prep, plugin]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Attach packages to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft > release-state.json; then
            if ! jq -e '.isDraft == true' release-state.json > /dev/null; then
              echo "Refusing to replace assets on a published release. Use a new version tag."
              exit 1
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes 'Offline Kindle Photo Frame. Photo Prep builds are unsigned. See the README for installation and security prompts. Review the release verification checklist before publishing.'
          fi
          gh release upload "$TAG" release/*.zip release/SHA256SUMS.txt --clobber
